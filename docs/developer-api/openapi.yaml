openapi: 3.1.0

# The LPC Developer API.
#
# Hand-written rather than generated, because the generator would describe the
# Go structs and what a third party needs described is the contract: which scope
# each route wants, what a player reference is, and what the error codes mean.
#
# See QUICKSTART.md for the walkthrough and DEVELOPER_API.md for the design.

info:
  title: LPC Developer API
  version: "1.0.0"
  description: |
    Community-scoped API keys for building against Lines Police CAD.

    **Authentication.** Send your key as `Authorization: Bearer lpc_live_…` on
    every request. Not in `X-API-Key`: that header is our own first-party
    gateway secret and a developer key will never satisfy it.

    **Player references.** You name a player by their game identifier, as
    `provider:identifier`, `fivem:1a2b3c4d`, `discord:198573466634`. Never by
    an email, and never by an LPC user id you did not get from us. A FiveM
    `license:` prefix is optional and case does not matter.

    **Simulated characters.** Mark an NPC with `"synthetic": true` when you
    provision it, and its records inherit the mark. Synthetic records are left
    out of the searches and rosters players see unless a caller asks for them
    with `includeSynthetic=true`, so you can populate a city without burying
    the real players in it. You can delete your own synthetic records when a
    test run is done.

    **What this API cannot do.** There is no scope and no endpoint for money,
    billing, account security, admin, community settings or roles, and there
    will not be. It also cannot file a report, or approve, deny or review a
    warrant: a report draft is a proposal for a person to act on, and a warrant
    request is answered by the community's own approval mode rather than by the
    key. Those are not gaps, a record with legal consequences inside a
    community is a person's decision.

    **Finding out what happened.** Every response carries `X-Request-Id`, and
    `GET /activity` is this key's own request history, which route, which
    community, what we answered, and on a refusal which of our error codes we
    used. Quote a request id in a ticket and we can find it. Send
    `X-Correlation-Id` and we echo it back so your logs line up with ours,
    letters, digits and `. _ : -`, up to 128 characters, since it is the one
    value we reflect; anything else is dropped rather than echoed.

    **Finding out what changed.** `GET /communities/{id}/changes` takes a
    cursor and returns only what has happened since, so polling costs a request
    rather than a sweep. The same events can be pushed to you instead: register
    a webhook in the console and you get them signed, over HTTPS, with a
    published retry schedule. One event shape serves both, so moving from
    polling to webhooks does not mean rewriting your handler.

    **Verifying a webhook.** Each delivery carries
    `X-LPC-Signature: t=<unix>,v1=<hex>`. Recompute it as
    `HMAC-SHA256(secret, "<t>." + rawBody)` and compare in constant time, then
    reject anything whose `t` is more than **300 seconds** old, that last step
    is what stops a captured delivery being replayable. Also sent:
    `X-LPC-Event-Id` (stable, so a retry is recognisable),
    `X-LPC-Event-Type`, `X-LPC-Delivery-Id` and `X-LPC-Attempt`. Answer `2xx`
    quickly and do your work afterwards; a non-2xx is retried after 10s, 30s,
    2m, 5m and 15m, and an endpoint that fails 20 deliveries in a row is
    switched off with a reason shown in the console. Nothing is lost when a
    delivery fails: the event stays readable from the cursor endpoint for its
    retention window.

    **Rate limits.** Every response carries `X-RateLimit-*`, and a 429 carries
    `Retry-After`. Use the bulk status endpoint on a tick rather than looping
    over players: one call per tick stays inside the free limit where a loop
    over 64 players does not.
  contact:
    name: LPC support
    url: https://discord.gg/Y9ytW2ZMp4
  license:
    name: Proprietary

servers:
  - url: https://api.linespolice-cad.com/api/v1/dev
    description: >-
      Production. Defined once in models.DeveloperAPIBaseURL and overridable
      with DEVELOPER_API_PUBLIC_BASE_URL, so this list cannot drift from the
      quickstart or the console.

security:
  - developerKey: []

tags:
  - name: Key
    description: Checking your own credentials.
  - name: Communities
    description: The communities a key may act in, and creating new ones.
  - name: Players
    description: Mapping game identifiers to LPC accounts, and claim codes.
  - name: Members
    description: The roster, driven by an acting player.
  - name: Units
    description: Who is on duty, and their status.
  - name: Calls
  - name: BOLOs
  - name: Records
    description: Characters, vehicles, firearms and licenses.
  - name: Reports
    description: >-
      Reviewable drafts. Nothing here files a report: a draft is a proposal for
      a person with the community's permission to act on.
  - name: Warrants
    description: >-
      Reading warrants, and requesting one. A request is answered by the
      community's own approval mode, so read `status` on the response.
  - name: Simulated characters
    description: NPC records, and removing them.
  - name: Activity
    description: What this key called, and what we answered.
  - name: Changes
    description: >-
      What changed in a community since you last asked. The same events the
      webhooks deliver.
  - name: Attachments
    description: Metadata and a link, never bytes, and never "evidence".

paths:
  /whoami:
    get:
      tags: [Key]
      summary: Describe the calling key
      description: |
        Needs no scope, deliberately: a key with the wrong scopes still has to
        be able to find out what it does hold, or debugging a 403 means
        guessing. Start here when something is not working.
      responses:
        "200":
          description: The key, its plan, its limits, its communities and today's usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /communities:
    get:
      tags: [Communities]
      summary: List the communities this key may act in
      description: |
        Only ever returns communities already granted to this key, including
        pending and revoked grants so you can see a request you are waiting on.
        There is no search: a key cannot be used to discover communities it has
        no business with.
      security: [{ developerKey: [community:read] }]
      responses:
        "200":
          description: The key's communities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  communities:
                    type: array
                    items: { $ref: "#/components/schemas/CommunitySummary" }
        "403": { $ref: "#/components/responses/MissingScope" }
    post:
      tags: [Communities]
      summary: Create a community
      description: |
        The community is owned by **your** LPC account and counts against your
        plan exactly like one created on the website. It starts private.

        Three limits apply: your own plan's community cap, a per-key daily
        creation cap, and a per-key total.
      security: [{ developerKey: [communities:provision] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string }
                tags:
                  type: array
                  items: { type: string }
                visibility:
                  type: string
                  enum: [private, public]
                  default: private
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  community: { $ref: "#/components/schemas/CreatedCommunity" }
        "403":
          description: |
            `owner_community_limit_reached`: the developer's own plan cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`community_limit_reached`: this key's total."
        "429":
          description: "`provision_cap_reached`: this key's daily cap."

  /communities/{communityId}/departments:
    get:
      tags: [Communities]
      summary: List departments and their ranks
      description: Read these ids rather than hardcoding them; owners edit them.
      security: [{ developerKey: [community:read] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      responses:
        "200":
          description: The community's departments.
        "403": { $ref: "#/components/responses/CommunityNotGranted" }

  /communities/{communityId}/ten-codes:
    get:
      tags: [Communities]
      summary: List ten-codes
      description: |
        You need these ids to set a unit's status. Read them rather than
        hardcoding: a hardcoded id breaks the day an owner renames a code.
      security: [{ developerKey: [community:read] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      responses:
        "200":
          description: The community's ten-codes.
        "403": { $ref: "#/components/responses/CommunityNotGranted" }

  /players:
    post:
      tags: [Players]
      summary: Upsert a player by game identifier
      description: |
        **Idempotent.** Call it on every connect. The same identifier always
        returns the same account, enforced by a unique index rather than by a
        check, so two servers calling at the same instant still end up with one
        account.

        A player we have not seen gets a new account that **cannot be logged
        into**: it holds no email and no password. That is the mechanism, not an
        omission, an email you send us is an email you control. The player
        takes ownership with a claim code.

        **Simulated characters.** Set `synthetic: true` for an NPC. It is a
        claim you make, not something we infer, the same key provisions
        accounts for real players arriving from the game, so "a key created it"
        says nothing about whether there is a person behind it. A synthetic
        player, and every record it owns, is left out of the searches and
        rosters players see unless the caller passes `includeSynthetic=true`.
        Claiming overrides it: if a person ever signs in and takes the account
        over, they are a player from then on.

        Synthetic accounts count against this key's daily provisioning cap, so
        a runaway loop is still bounded, but they do not count against a
        player's own per-community character cap, an NPC is nobody's
        character, and counting it both ways would mean your scenery consuming
        your players' allowances.
      security: [{ developerKey: [players:provision] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, identifier]
              properties:
                provider: { $ref: "#/components/schemas/Provider" }
                identifier:
                  type: string
                  description: FiveM license (with or without the `license:` prefix), Discord ID, or Steam ID.
                  example: "license:1a2b3c4d5e6f7a8b"
                username:
                  type: string
                  maxLength: 32
                  description: A display name only. Never used to find or match an account.
                synthetic:
                  type: boolean
                  default: false
                  description: >-
                    This identifier is a simulated character, not a person. See
                    the description above.
      responses:
        "200":
          description: The player was already known.
          content:
            application/json:
              schema:
                type: object
                properties:
                  player: { $ref: "#/components/schemas/Player" }
        "201":
          description: A new account was created, unclaimed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  player: { $ref: "#/components/schemas/Player" }
        "429":
          description: "`provision_cap_reached`: the daily account cap. Lookups of players you already know still work."

  /players/{provider}/{identifier}:
    get:
      tags: [Players]
      summary: Look a player up
      description: |
        Only players **your** key created are visible. Otherwise a key could ask
        whether an arbitrary Discord ID has an LPC account, which is nobody's
        business but the account holder's.
      security: [{ developerKey: [players:provision] }]
      parameters:
        - { $ref: "#/components/parameters/provider" }
        - { $ref: "#/components/parameters/identifier" }
      responses:
        "200":
          description: The player.
        "404":
          description: "`player_not_found`: no player of yours has that identifier."

  /players/{provider}/{identifier}/claim-code:
    post:
      tags: [Players]
      summary: Issue a claim code
      description: |
        Show the code and URL in game. The player opens the URL, signs in or
        signs up, and enters the code; everything you made for them moves onto
        their account.

        Single use, 30 minutes, and issuing a new one kills any outstanding
        code, so an older code still visible in a stream VOD stops working.
        Only for unclaimed accounts your key created.
      security: [{ developerKey: [players:provision] }]
      parameters:
        - { $ref: "#/components/parameters/provider" }
        - { $ref: "#/components/parameters/identifier" }
      responses:
        "201":
          description: The code. Shown once; only its hash is stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "K7M2-QX9P-4T" }
                  expiresAt: { type: string, format: date-time }
                  url: { type: string, format: uri }
                  instructions: { type: string }
        "404": { description: "`player_not_found`" }
        "409": { description: "`already_claimed`: the player owns their account; they sign in normally." }

  /communities/{communityId}/members:
    get:
      tags: [Members]
      summary: List the roster
      description: |
        Simulated characters are left out unless you ask for them. A page of
        four hundred NPCs with twelve players among them is not a roster.
      security: [{ developerKey: [members:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/includeSynthetic" }
      responses:
        "200": { description: The community's members. }
        "403": { $ref: "#/components/responses/CommunityNotGranted" }
    post:
      tags: [Members]
      summary: Add a member
      description: |
        `actingPlayer` is the player doing the adding, and they must hold
        **manage members** in the community (the owner and administrators
        always do). **A key never grants more than the acting player holds.**

        A friend we have not seen is provisioned here, so "invite my mate" is
        one call. The response's `needsClaim` tells you to show them a claim
        code.

        Adding an existing member is a no-op rather than an error, so calling
        this on every join is safe.
      security: [{ developerKey: [members:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actingPlayer, player]
              properties:
                actingPlayer: { $ref: "#/components/schemas/PlayerRef" }
                player: { $ref: "#/components/schemas/PlayerRef" }
                username: { type: string }
                status:
                  type: string
                  enum: [approved, pending]
                  default: approved
      responses:
        "200": { description: "Already a member; `added` is false." }
        "201": { description: Added. }
        "403":
          description: |
            `acting_player_lacks_permission`, `acting_player_not_a_member`,
            `acting_player_banned`, or `player_banned`: a banned player cannot
            be re-invited by a key; an admin lifts the ban on the website.

  /communities/{communityId}/members/{playerRef}:
    patch:
      tags: [Members]
      summary: Set a member's department and rank
      description: |
        Roles are **not** assignable by a key: roles carry permissions, so a key
        handing one out is a privilege-escalation path. Sending `roleId` is a
        403. Change roles on the website.
      security: [{ developerKey: [members:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/playerRef" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actingPlayer, departmentId]
              properties:
                actingPlayer: { $ref: "#/components/schemas/PlayerRef" }
                departmentId: { type: string }
                rankId: { type: string }
      responses:
        "200": { description: Updated. }
        "403": { description: "`roles_not_assignable`, or an acting-player failure." }
        "404": { description: "`department_not_found` or `rank_not_found`." }
        "409": { description: "`not_a_member`" }
    delete:
      tags: [Members]
      summary: Remove a member, or leave
      description: |
        Leaving is this call with `actingPlayer` equal to the target, and needs
        no permission. Removing somebody else needs **manage members**.

        The owner can neither be removed nor leave: a community with no owner
        has nobody who can administer it. Transfer ownership on the website.
      security: [{ developerKey: [members:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/playerRef" }
      responses:
        "200": { description: Removed, or already not a member. }
        "409": { description: "`owner_cannot_be_removed`" }

  /communities/{communityId}/members/{playerRef}/approve:
    post:
      tags: [Members]
      summary: Approve a join request
      security: [{ developerKey: [members:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/playerRef" }
      responses:
        "200": { description: Approved, or already approved. }
        "404": { description: "`no_request`" }
        "403": { description: "`player_banned`, or an acting-player failure." }

  /communities/{communityId}/units:
    get:
      tags: [Units]
      summary: Who is on duty
      security: [{ developerKey: [units:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: onDuty
          in: query
          schema: { type: boolean }
          description: Only units with a status set.
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: The units. }

  /communities/{communityId}/units/status/bulk:
    put:
      tags: [Units]
      summary: Set many units' statuses
      description: |
        **Use this on a tick, not the single-unit endpoint in a loop.** A server
        with 64 players looping once a second is 3,840 requests a minute, over
        even the paid limit. One bulk call per tick is 60 a minute.

        **Partial by design.** Each unit reports its own result, so one unknown
        player does not discard the other sixty-three, a game server cannot
        usefully retry a whole tick. Up to 100 units per call.
      security: [{ developerKey: [units:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/UnitStatusEntry" }
      responses:
        "200":
          description: Per-unit results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
                  failed: { type: integer }
                  units:
                    type: array
                    items: { $ref: "#/components/schemas/UnitStatusResult" }
        "400": { description: "`too_many_units`, or an empty batch." }

  /communities/{communityId}/units/{playerRef}/status:
    put:
      tags: [Units]
      summary: Set one unit's status
      description: |
        For reacting to a single event. A failure here is the whole request, so
        it returns 422 rather than a 200 with the error buried in a list.
      security: [{ developerKey: [units:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/playerRef" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitStatusEntry" }
      responses:
        "200": { description: Set. }
        "422": { description: "`ten_code_not_found`, `player_not_a_member`, `department_not_found` or `nothing_to_set`." }

  /communities/{communityId}/calls:
    get:
      tags: [Calls]
      summary: List calls
      description: Open calls only unless `includeClosed=true`.
      security: [{ developerKey: [calls:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: includeClosed
          in: query
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: The calls. }
    post:
      tags: [Calls]
      summary: Raise a call
      description: |
        `caller` is optional: plenty of calls are raised by a script rather than
        a person. When given, it must be a member.

        `location` is written into the top of the call's text, because the call
        model has no location field, a location stored where no surface renders
        it is one no officer would ever see.
      security: [{ developerKey: [calls:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                location: { type: string }
                caller: { $ref: "#/components/schemas/PlayerRef" }
                departments:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: Raised, and pushed to live dashboards. }

  /communities/{communityId}/dispatch/calls:
    post:
      tags: [Calls]
      summary: Create or update a dispatch call by your own id
      description: |
        **Idempotent on `(community, source, externalId)`.** This is the shape a
        game server needs: it reconnects, replays a queue and retries a
        timeout, and none of that may put a second call on a dispatch board.

        Posting the same `externalId` twice updates rather than duplicating, and
        the response says which happened. `source` defaults to the key's name,
        and can be set explicitly so one developer's dev and production
        instances keep separate id spaces.

        Fields you leave out on an update are **left alone, not cleared**, so a
        status update need not resend the location and type.

        Assignment is all-or-nothing: if one unit is not a member the whole
        write is refused, because a dispatch board that is quietly wrong is
        worse than one that rejects you.
      security: [{ developerKey: [calls:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchCallWrite" }
      responses:
        "200":
          description: "An existing call was updated (`created` is false)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { $ref: "#/components/schemas/DispatchCall" }
                  created: { type: boolean }
        "201":
          description: "A new call was created (`created` is true)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { $ref: "#/components/schemas/DispatchCall" }
                  created: { type: boolean }
        "400": { description: "`invalid_external_id` or `invalid_title`." }
        "403": { description: "`player_not_a_member`: someone in assignedUnits." }

  /communities/{communityId}/dispatch/calls/{externalId}:
    get:
      tags: [Calls]
      summary: Read a call back by your own id
      description: |
        For reconciliation after an outage: a server that restarted knows its
        own incident ids and nothing else, and needs to find out what we think
        the state is before it resumes.

        The response carries both ids, yours to match on, ours for the deep
        link.
      security: [{ developerKey: [calls:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: source
          in: query
          schema: { type: string }
          description: Defaults to the key's name.
      responses:
        "200":
          description: The call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { $ref: "#/components/schemas/DispatchCall" }
        "404": { description: "`call_not_found`" }

  /communities/{communityId}/dispatch/calls/{externalId}/close:
    post:
      tags: [Calls]
      summary: Close a call by your own id, with a disposition
      description: |
        Closing an already-closed call returns 200 with `closed` set to false
        rather than an error, so a retry after a timeout is not something you
        have to special-case.
      security: [{ developerKey: [calls:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                disposition: { type: string, example: "Arrest made" }
      responses:
        "200":
          description: Closed, or already closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { $ref: "#/components/schemas/DispatchCall" }
                  closed: { type: boolean }
        "404": { description: "`call_not_found`" }

  /communities/{communityId}/calls/{callId}/close:
    post:
      tags: [Calls]
      summary: Close a call
      security: [{ developerKey: [calls:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: callId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Closed. }
        "404": { description: "`call_not_found`: including a call in another community." }

  /communities/{communityId}/bolos:
    get:
      tags: [BOLOs]
      summary: List BOLOs
      security: [{ developerKey: [bolos:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: The BOLOs. }
    post:
      tags: [BOLOs]
      summary: Raise a BOLO
      description: |
        `reporter` is required and must be a member: a BOLO is acted on by other
        players, so an unattributable one is worse than none.

        `plate` is written into the description text, for the same reason a
        call's location is.
      security: [{ developerKey: [bolos:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, reporter]
              properties:
                title: { type: string }
                reporter: { $ref: "#/components/schemas/PlayerRef" }
                description: { type: string }
                location: { type: string }
                plate: { type: string }
                departmentId:
                  type: string
                  description: Scopes the BOLO to one department instead of the community.
      responses:
        "201": { description: Raised. }

  /communities/{communityId}/civilians:
    get:
      tags: [Records]
      summary: Look characters up by name
      security: [{ developerKey: [civilians:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: name
          in: query
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/includeSynthetic" }
      responses:
        "200": { description: Matching characters, scoped to this community. }
    post:
      tags: [Records]
      summary: Create a character
      description: |
        The community's own settings apply. If its approval system is on, the
        character arrives `pending` and `pendingApproval` is true; if it caps
        characters per player, that cap applies. **A key does not override the
        settings the owner chose.**
      security: [{ developerKey: [civilians:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, firstName, lastName]
              properties:
                player: { $ref: "#/components/schemas/PlayerRef" }
                firstName: { type: string }
                lastName: { type: string }
                birthday: { type: string, example: "1998-04-10" }
                gender: { type: string }
                race: { type: string }
                hairColor: { type: string }
                eyeColor: { type: string }
                height: { type: string }
                weight: { type: string }
                address: { type: string }
                occupation: { type: string }
                image: { type: string, format: uri }
                synthetic:
                  type: boolean
                  default: false
                  description: >-
                    Mark this as a simulated character's record, which keeps it
                    out of the searches and rosters players see. Inherited too:
                    a record whose owner was provisioned as synthetic is
                    synthetic whether or not you repeat the flag, so mark your
                    NPCs once at `POST /players`.
                externalId:
                  type: string
                  maxLength: 128
                  description: >-
                    Your own handle for what this record stands for. Only
                    useful on a synthetic record, where it is what makes one
                    addressable for cleanup later.
                source: { type: string }
      responses:
        "201": { description: Created. }
        "403": { description: "`player_not_a_member`" }
        "409": { description: "`civilian_limit_reached`" }

  /communities/{communityId}/vehicles:
    get:
      tags: [Records]
      summary: Look a vehicle up by plate
      security: [{ developerKey: [vehicles:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: plate
          in: query
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/includeSynthetic" }
      responses:
        "200":
          description: |
            Matching vehicles. The `stolen`, `validRegistration` and
            `validInsurance` flags are booleans here: the stored values use two
            historical encodings with opposite polarity, so they are resolved
            for you.
    post:
      tags: [Records]
      summary: Register a vehicle to a character
      security: [{ developerKey: [vehicles:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, civilianId, plate]
              properties:
                player: { $ref: "#/components/schemas/PlayerRef" }
                civilianId: { type: string }
                plate: { type: string }
                licensePlateState: { type: string }
                vin: { type: string }
                make: { type: string }
                model: { type: string }
                year: { type: string }
                color: { type: string }
                type: { type: string }
                image: { type: string, format: uri }
      responses:
        "201": { description: Registered. }
        "404": { description: "`civilian_not_found`: one answer for absent, not theirs, and not in this community." }

  /communities/{communityId}/firearms:
    get:
      tags: [Records]
      summary: Look a firearm up by serial
      security: [{ developerKey: [firearms:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: serial
          in: query
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/includeSynthetic" }
      responses:
        "200": { description: Matching firearms. }
    post:
      tags: [Records]
      summary: Register a firearm to a character
      security: [{ developerKey: [firearms:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, civilianId, serialNumber]
              properties:
                player: { $ref: "#/components/schemas/PlayerRef" }
                civilianId: { type: string }
                serialNumber: { type: string }
                name: { type: string }
                weaponType: { type: string }
                caliber: { type: string }
                image: { type: string, format: uri }
      responses:
        "201": { description: Registered. }

  /communities/{communityId}/licenses:
    post:
      tags: [Records]
      summary: Issue a license to a character
      security: [{ developerKey: [licenses:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, civilianId, type]
              properties:
                player: { $ref: "#/components/schemas/PlayerRef" }
                civilianId: { type: string }
                type: { type: string, example: "Driver License" }
                status: { type: string, default: Approved }
                expirationDate: { type: string, example: "10/25/2034" }
                notes: { type: string }
      responses:
        "201": { description: Issued. }

  /communities/{communityId}/reports/drafts:
    post:
      tags: [Reports]
      summary: Write a reviewable draft incident, arrest or citation report
      description: |
        **This does not file a report.** It writes a draft for a person in the
        community to read and act on, and there is no endpoint on this API that
        turns one into a record, the verb that files it lives on the website,
        behind the community's own permission.

        That is deliberate. An arrest report here produces jail time, a fine
        and a court case. A game server can observe a scuffle; it cannot know
        whether that was an arrest, and an integration that could file one
        would be making a call that belongs to a person. So treat a `201` as
        "the draft is in the queue", never as "the report exists".

        **Idempotent on `(community, source, externalId)`**, like a dispatch
        call and for the same reason: a retry must not put a second draft in
        somebody's queue. Posting the same `externalId` again updates the
        draft; the response says which happened.

        Once a person has filed or rejected a draft it is frozen. A late retry
        gets `409 draft_already_reviewed` and their decision is left alone.

        **Structured facts stay apart from the narrative.** `facts` is what the
        server observed; `narrative` is prose about it. A narrative with no
        `generated` field is recorded as generated, because the callers of this
        API are automated by definition, and a narrative can never be labelled
        as evidence.

        **Charges are priced by the community, not by you.** Send the violation
        names from the community's own penal code and we fill in the fine and
        the jail time from it. A name the community does not have is refused.

        **`reportingOfficer` is required and is what gets checked.** The key's
        scope decides whether it may propose a draft at all; whether this
        particular draft is allowed is decided by that player's access, an
        approved, unbanned member who is in a department. If you name a
        `templateSlug`, the community's own form gates apply to them too.
      security: [{ developerKey: [reports:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportDraftWrite" }
      responses:
        "200":
          description: "An existing draft was updated (`created` is false)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/ReportDraft" }
                  created: { type: boolean }
        "201":
          description: "A new draft was written (`created` is true). Nothing was filed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/ReportDraft" }
                  created: { type: boolean }
        "400":
          description: >-
            `invalid_external_id`, `invalid_kind`, `reporting_officer_required`,
            `template_not_found`, `charge_not_in_penal_code`, `invalid_facts`.
        "403":
          description: >-
            `reporting_officer_not_a_member`,
            `reporting_officer_has_no_department`,
            `reporting_officer_not_in_department`, `template_not_permitted`,
            `template_disabled_for_department`, `subject_not_a_member`.
        "409":
          description: >-
            `draft_already_reviewed`: a person has filed or rejected it, so it
            can no longer be changed. Write a new draft with a new `externalId`
            if there is more to report.
    get:
      tags: [Reports]
      summary: List the drafts this key wrote
      description: |
        Scoped to the calling key, not to the community: you read back your own
        output, not what the community's officers or another integration have
        written.

        Pages are 1-based, like every other list in this product.
      security: [{ developerKey: [reports:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted, rejected, withdrawn] }
        - name: kind
          in: query
          schema: { type: string, enum: [incident, arrest, citation] }
      responses:
        "200":
          description: A page of drafts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportDraft" }
                  totalCount: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }

  /communities/{communityId}/reports/drafts/{externalId}:
    get:
      tags: [Reports]
      summary: Read a draft back by your own id
      description: |
        How you find out what a person decided. `status`, `reviewNotes`,
        `filedRecordId` and `filedRecordKind` are all here, so a game server can
        tell a player "your report was filed" rather than guessing.
      security: [{ developerKey: [reports:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: source
          in: query
          schema: { type: string }
          description: Defaults to the key's name.
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/ReportDraft" }
        "404": { description: "`draft_not_found`" }
    delete:
      tags: [Reports]
      summary: Withdraw a draft nobody has acted on
      description: |
        Withdrawn, not deleted, and only while it is still a draft. A draft you
        wrote by mistake can be taken out of the queue; a decision a person has
        made cannot be erased.

        Withdrawing twice returns 200 with `withdrawn` set to false, so a retry
        after a timeout is not something you have to special-case.
      security: [{ developerKey: [reports:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Withdrawn, or already withdrawn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/ReportDraft" }
                  withdrawn: { type: boolean }
        "404": { description: "`draft_not_found`" }
        "409": { description: "`draft_already_reviewed`" }

  /communities/{communityId}/warrants:
    get:
      tags: [Warrants]
      summary: List a community's warrants
      description: |
        Filter by `accused` to answer the question a game server actually asks
        on a stop, "is there a warrant out for this person?", in one request
        rather than a scan.

        Pages are 1-based.
      security: [{ developerKey: [warrants:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, executed, expired, withdrawn]
        - name: accused
          in: query
          schema: { $ref: "#/components/schemas/PlayerRef" }
          description: A player reference. Resolved the same way as everywhere else.
      responses:
        "200":
          description: A page of warrants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Warrant" }
                  totalCount: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }

  /communities/{communityId}/warrants/requests:
    post:
      tags: [Warrants]
      summary: Request a warrant for the community's reviewer
      description: |
        **The community's own `warrantApprovalMode` decides this**, exactly as
        it does for a warrant raised on the website:

        - `require-judge`: lands `pending` for a judge to review.
        - `random`: decided immediately, with a random judge name, at the
          community's own `warrantRandomApprovalRate` (70% unless it sets one).
        - `auto-approve`, or unset: approved immediately, judge name
          `Auto-Approved`.

        So read `status` on the response rather than assuming it, and under
        `require-judge` poll `GET /warrants` or subscribe for the outcome.

        What a key cannot do is decide. It asks, on behalf of an officer it has
        to name and who passes the same checks as anyone else, and the
        community's rule answers. There is no approve, deny or review route
        under this prefix, and the outcome is never read from your request
        body.

        The warrant's first history entry names your integration, so anyone
        reading it later can see a script raised it. Both halves are events:
        `warrant.requested` always, and `warrant.reviewed` as well when the
        community decided it on the spot.

        **Idempotent on `(community, source, externalId)`.** A retry returns the
        request you already made, at whatever stage it has reached, so a queue
        replay cannot flood a judge, and a retry after approval hands you the
        decision rather than raising a second request.

        `probableCause` is required: a reviewer cannot act on a request that
        does not say what it is for. Charges are priced from the community's own
        penal code, as for a report draft.
      security: [{ developerKey: [warrants:write] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarrantRequest" }
      responses:
        "200":
          description: >-
            This request already exists (`created` is false). The warrant is
            returned at whatever stage it has reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  warrant: { $ref: "#/components/schemas/Warrant" }
                  created: { type: boolean }
        "201":
          description: "Requested (`created` is true). Status is `pending`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  warrant: { $ref: "#/components/schemas/Warrant" }
                  created: { type: boolean }
        "400":
          description: >-
            `invalid_external_id`, `invalid_warrant_type`,
            `probable_cause_required`, `accused_required`,
            `charge_not_in_penal_code`.
        "403":
          description: >-
            `reporting_officer_not_a_member`,
            `reporting_officer_has_no_department`, `accused_not_a_member`.

  /communities/{communityId}/warrants/{warrantId}:
    get:
      tags: [Warrants]
      summary: Read one warrant
      description: |
        The community is part of the lookup, so a warrant id from another
        community is a 404 rather than a 403, its existence is never
        confirmed.
      security: [{ developerKey: [warrants:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: warrantId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{24}$" }
      responses:
        "200":
          description: The warrant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  warrant: { $ref: "#/components/schemas/Warrant" }
        "404": { description: "`warrant_not_found`" }

  /communities/{communityId}/synthetic-records:
    delete:
      tags: [Simulated characters]
      summary: Remove the simulated records this key created
      description: |
        For cleaning up after a test run, and it needs nobody's help.

        Three boundaries, and each is the whole safety of the endpoint:

        * **synthetic only**: a record created for a real player is never
          touched, whichever key made it;
        * **this key only**: you cannot clean up another integration's output,
          even in a community you both hold;
        * **this community only**: scoped by the community in the path.

        `confirm` must be the community id. This endpoint deletes rows, so it
        will not run against an id the caller did not state, which is what
        stops a cleanup aimed at a test community running against a live one
        because a config value was stale.

        Narrow it further with `source` and `externalId`. Batches are bounded;
        when `more` is true, call again.

        A community owner can also remove everything a key wrote, from the
        community's settings on the website. That path is for an integration
        that has stopped answering, so it does not need the key's cooperation.
      security: [{ developerKey: [players:provision] }]
      parameters: [{ $ref: "#/components/parameters/communityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The community id, exactly as it appears in the path.
                source: { type: string }
                externalId: { type: string, maxLength: 128 }
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: object
                    additionalProperties: { type: integer }
                    example: { civilians: 97, vehicles: 180 }
                  total: { type: integer }
                  more:
                    type: boolean
                    description: True when the batch cap was reached. Call again.
        "400": { description: "`confirm_required`, `invalid_source`, `invalid_external_id`." }

  /activity:
    get:
      tags: [Activity]
      summary: What this key called, and what we answered
      description: |
        **No scope required**, for the same reason `whoami` needs none: a key
        that is being refused has to be able to find out why, and gating the
        diagnostic would withhold it from exactly the keys that need it.

        Every response from this API carries `X-Request-Id`. Quoting one in a
        support ticket is enough for us to find the row, and if you send
        `X-Correlation-Id`, we echo it back and record it beside ours, so you
        can line your logs up against ours.

        A row says which route, which community, what we answered, and which of
        our `error` codes we used. On a `missing_scope` refusal it names the
        scope, which is the most common thing this feed exists to explain.

        **What a row does not hold**: no request body, no response body, no
        header values, no key material and no claim code. The feed is for
        debugging the shape of an exchange, not its contents.

        Retention is **30 days**, and the response repeats it so a client
        storing these rows knows how long it has.
      security: [{ developerKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - name: communityId
          in: query
          schema: { type: string, pattern: "^[a-f0-9]{24}$" }
        - name: outcome
          in: query
          schema:
            type: string
            enum: [ok, denied, rate_limited, invalid, error]
          description: >-
            Coarser than a status code on purpose. `denied` is what you want
            when the question is "show me what was refused".
        - name: requestId
          in: query
          schema: { type: string }
          description: Look one request up by the id we returned for it.
      responses:
        "200":
          description: A page of requests, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityRow" }
                  totalCount: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  retentionDays: { type: integer, example: 30 }

  /communities/{communityId}/changes:
    get:
      tags: [Changes]
      summary: What changed since you last asked
      description: |
        One request instead of a sweep. Without this, finding out whether a call
        was closed means re-reading every call, on a busy community that is a
        scan per tick, and it is why polling has a reputation for being
        expensive.

        **The cursor is an event id, and the events are the same rows the
        webhooks deliver.** That is deliberate: start on the cursor, move to
        webhooks later without rewriting the handler that consumes an event,
        and run both while you migrate, a stable event id makes the duplicate
        detectable rather than a problem.

        **Call it with no `since` first.** You get no events and a cursor
        pointing at now (`primed: true`), because replaying a week of history
        to a client that is about to read current state anyway is not a
        service. Then poll with that cursor; each response hands you the next
        one, also in the `X-LPC-Cursor` header so a Lua callback need not parse
        the body.

        **Pass `excludeSelf=true`** unless you want your own writes back. This
        is the difference between a working integration and a loop: close a
        call, receive your own `call.closed`, close it again.

        Events are kept **7 days**: shorter than the activity feed on purpose.
        A cursor staler than that means you should re-read current state rather
        than replay a week, and `hasMore` tells you when to call again rather
        than making you compute a total.
      security: [{ developerKey: [community:read] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - name: since
          in: query
          schema: { type: string }
          description: >-
            A cursor from a previous response. Omit it on the first call to get
            a position without the history.
        - { $ref: "#/components/parameters/limit" }
        - name: types
          in: query
          schema: { type: string }
          example: call.created,call.closed
          description: >-
            Comma-separated event types. An unknown type is refused rather than
            silently matching nothing.
        - name: excludeSelf
          in: query
          schema: { type: boolean, default: false }
          description: Leave out changes this key caused.
      responses:
        "200":
          description: The changes after the cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChangeEvent" }
                  cursor:
                    type: string
                    description: Pass this as `since` next time.
                  hasMore:
                    type: boolean
                    description: Call again. There is no total; you cannot act on one.
                  primed:
                    type: boolean
                    description: True when this call only established a position.
                  retentionDays: { type: integer, example: 7 }
        "400": { description: "`invalid_cursor` or `invalid_event_type`." }

  /communities/{communityId}/reports/drafts/{externalId}/attachments:
    post:
      tags: [Attachments]
      summary: Attach metadata and a link to a report draft
      description: |
        **Metadata and a link. We host no bytes, and there is no upload
        endpoint.** Accepting third-party binaries would mean scanning them,
        storing them, quotas, a takedown path and a legal position on content
        we host, and none of that is needed for the thing people actually want,
        which is a reviewer clicking through to the clip your server already
        recorded.

        **`kind` is never `evidence`.** A link you supply points at something we
        have not seen, on a server we do not control; calling it evidence inside
        a system that produces jail time would give it a standing it has not
        earned. Use `clip`, `screenshot`, `log`, `document` or `other`, and let
        a person decide what it is. The same applies to a generated narrative.

        We never fetch the URL, so it is a link a person clicks in their own
        browser rather than a request we make.

        Idempotent on the URL: the same link twice returns the attachment that
        exists rather than giving a reviewer two of the same thing to look at.
        Nothing can be attached once a person has reviewed the draft.
      security: [{ developerKey: [reports:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: source
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentWrite" }
      responses:
        "200":
          description: "This link is already attached (`added` is false)."
        "201":
          description: Attached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/Attachment" }
                  added: { type: boolean }
        "400":
          description: >-
            `invalid_attachment`: an unknown kind, no url, credentials in the
            url, an out-of-range size, or `kind: "evidence"`.
        "409":
          description: >-
            `attachment_limit_reached` (10 per record) or
            `draft_already_reviewed`.

  /communities/{communityId}/reports/drafts/{externalId}/attachments/{attachmentId}:
    delete:
      tags: [Attachments]
      summary: Detach one
      description: Only while the draft is still a draft.
      security: [{ developerKey: [reports:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200": { description: Detached. }
        "404": { description: "`draft_not_found`" }
        "409": { description: "`draft_already_reviewed`" }

  /communities/{communityId}/dispatch/calls/{externalId}/attachments:
    post:
      tags: [Attachments]
      summary: Attach metadata and a link to a dispatch call
      description: |
        The same shape as a draft attachment, on a call. Useful because the clip
        usually exists while the call is still open and before anybody has
        written a report, which is the moment a dispatcher wants to see it.
      security: [{ developerKey: [calls:write] }]
      parameters:
        - { $ref: "#/components/parameters/communityId" }
        - { $ref: "#/components/parameters/externalId" }
        - name: source
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentWrite" }
      responses:
        "200": { description: "Already attached (`added` is false)." }
        "201": { description: Attached. }
        "404": { description: "`call_not_found`" }
        "409": { description: "`attachment_limit_reached`" }

components:
  securitySchemes:
    developerKey:
      type: http
      scheme: bearer
      bearerFormat: lpc_live_
      description: |
        Your key, as `Authorization: Bearer lpc_live_…`.

        The scopes listed per operation are what that route requires. A key
        without one gets a 403 naming the scope it needed.

  parameters:
    communityId:
      name: communityId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{24}$" }
      description: A community this key is granted. Get the ids from `GET /communities`.
    externalId:
      name: externalId
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
      description: Your own id for the incident.
      example: sixpd-incident-42
    playerRef:
      name: playerRef
      in: path
      required: true
      schema: { type: string }
      example: "fivem:1a2b3c4d5e6f7a8b"
    provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Provider" }
    identifier:
      name: identifier
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    includeSynthetic:
      name: includeSynthetic
      in: query
      schema: { type: boolean, default: false }
      description: >-
        Include the simulated characters a Developer API key created. Off by
        default, so a server that populated a city with NPCs still has a name
        database its officers can read. Setting it to `true` widens the result
        to everything; there is no way to ask for NPCs alone.

  responses:
    Unauthorized:
      description: |
        `invalid_key`. The key is wrong, revoked, or sent in the wrong header.
        An unknown key and a revoked key answer identically, so this cannot be
        used to discover which keys exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MissingScope:
      description: "`missing_scope`. The body names the scope the route needed."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CommunityNotGranted:
      description: |
        `community_not_granted`. One answer for "no such community" and "not
        granted to you", so a key cannot be used to probe which community ids
        exist. Also `community_pending_deletion` when an owner has deleted it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Provider:
      type: string
      enum: [fivem, discord, steam]

    PlayerRef:
      type: string
      description: |
        `provider:identifier`, for example `fivem:1a2b3c4d` or
        `discord:198573466634`. A FiveM `license:` prefix is optional.

        `lpc:<userId>` is accepted but buys nothing: the user still has to be a
        member of the community, which is the real boundary, so a forged id
        simply fails that check.
      example: "fivem:1a2b3c4d5e6f7a8b"

    Error:
      type: object
      properties:
        error:
          type: string
          description: A stable code to branch on.
          example: missing_scope
        message:
          type: string
          description: Written for a person to read.
        requiredScope: { type: string }
        retryAfterSeconds: { type: integer }
        limit: { type: integer }
        scope:
          type: string
          enum: [minute, day, accounts_per_day, communities_per_day]

    Whoami:
      type: object
      properties:
        key:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            displayPrefix:
              type: string
              description: Safe to quote in a support ticket. The key itself is not.
              example: lpc_live_a1b2c3d4
            scopes:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
        plan: { type: string, enum: [free, pro] }
        limits: { $ref: "#/components/schemas/Limits" }
        communities:
          type: array
          items: { $ref: "#/components/schemas/CommunitySummary" }
        usage:
          type: object
          properties:
            requestsToday: { type: integer }
            accountsCreatedToday: { type: integer }
            communitiesCreatedToday: { type: integer }
            dailyLimitResetsAt: { type: string, format: date-time }

    Limits:
      type: object
      description: >
        The allowances for a tier. The tier is the user's website subscription
        plan - free, base, premium, premium_plus - and there is no separate
        Developer API subscription. These govern rate only: how fast requests
        may come, how fast rows may be provisioned, and how many keys one
        developer may hold. How many communities a developer may own is not
        here: it comes from the same plan's CommunityCap. See
        CommunityAllowance. An inactive or unrecognised plan resolves to free.
      properties:
        requestsPerMinute: { type: integer }
        requestsPerDay: { type: integer }
        keysPerDeveloper: { type: integer }
        accountsPerKeyDay: { type: integer }
        communitiesPerKeyDay:
          type: integer
          description: Communities this key may create per day. A pace, not a total.

    CommunityAllowance:
      type: object
      description: >
        How many communities this person may own, from their website plan. A
        community created with a key counts exactly like one created by hand on
        the website, and the same cap refuses the one that would go over.
      properties:
        plan:
          type: string
          description: The website subscription plan the cap comes from.
          example: premium
        owned: { type: integer, example: 2 }
        cap:
          type: integer
          description: Ignore when unlimited is true.
          example: 10
        unlimited:
          type: boolean
          description: True on plans with no cap, where cap carries a sentinel.
        source:
          type: string
          enum: [website_plan]

    CommunitySummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        grantSource:
          type: string
          enum: [created_by_key, owner_approved]
        grantStatus:
          type: string
          enum: [pending, active, revoked]
          description: Only `active` can be acted in.
        membersCount: { type: integer }
        pendingDeletion:
          type: boolean
          description: The owner deleted it. Read-only for 30 days.

    CreatedCommunity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        visibility: { type: string }
        createdAt: { type: string, format: date-time }

    Player:
      type: object
      properties:
        playerRef: { $ref: "#/components/schemas/PlayerRef" }
        playerId: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        identifier: { type: string }
        username: { type: string }
        claimed:
          type: boolean
          description: |
            False means the player has not taken ownership yet. They cannot log
            in, and cannot see what you made for them, until they do.
        created: { type: boolean }

    DispatchCallWrite:
      type: object
      required: [externalId, title]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: Your own id. Required, it is what makes these writes idempotent.
        source:
          type: string
          description: Your integration's name. Defaults to the key's name.
          example: SixPD
        title: { type: string }
        description: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 2000 }
        type:
          type: string
          description: Free text, not an enum, communities run their own taxonomies.
          example: traffic
        priority: { type: string, example: urgent }
        caller:
          allOf: [{ $ref: "#/components/schemas/PlayerRef" }]
          description: Optional. A callout a script generates has no player behind it.
        assignedUnits:
          type: array
          items: { $ref: "#/components/schemas/PlayerRef" }
          description: |
            Replaces the assignment outright, all-or-nothing. On an update,
            leave it out to keep the current assignment and send `[]` to
            unassign everyone.
        departments:
          type: array
          items: { type: string }
          description: |
            On an update, leave it out to keep the current departments and
            send `[]` to clear them.
        disposition:
          type: string
          description: Only meaningful on close.

    DispatchCall:
      type: object
      properties:
        id:
          type: string
          description: Our id, for the deep link.
        externalId: { type: string }
        source: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        type: { type: string }
        priority: { type: string }
        status: { type: string, enum: [open, closed] }
        disposition: { type: string }
        assignedUnits:
          type: array
          items: { type: string }
        departments:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        link:
          type: string
          format: uri
          description: Opens this call in the CAD, so you can put a URL in a player's chat.

    UnitStatusEntry:
      type: object
      properties:
        player: { $ref: "#/components/schemas/PlayerRef" }
        tenCodeId:
          type: string
          description: One of the community's own ten-codes. Read them from `/ten-codes`.
        location:
          type: string
          maxLength: 120
          description: Free text, as the game reports it.
          example: Grapeseed
        departmentId: { type: string }

    ReportDraftWrite:
      type: object
      required: [externalId, reportingOfficer]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: >-
            Your own id for this incident. Required: it is what makes repeated
            writes idempotent.
          example: sixpd-incident-42
        source:
          type: string
          description: Defaults to the key's name. Scopes the externalId space.
        kind:
          type: string
          enum: [incident, arrest, citation]
          default: incident
        callExternalId:
          type: string
          description: >-
            Link the draft to a dispatch call by your own id for that call,
            the id you still have after a restart.
        callId:
          type: string
          description: Our call id, if you kept it. `callExternalId` is usually easier.
        reportingOfficer:
          allOf: [{ $ref: "#/components/schemas/PlayerRef" }]
          description: >-
            The player who observed this. Required, and it is this player's
            community access that is checked, never the key's.
        departmentId:
          type: string
          description: >-
            Optional. Inferred when the officer is in exactly one department.
            The officer must be a member of whatever you name.
        templateSlug:
          type: string
          description: >-
            The community's own form this draft answers. Validated against the
            community's templates, the officer's access to it, and the
            department's toggle for it. Leave it out if you do not know the
            community's form layout.
        subject: { $ref: "#/components/schemas/ReportSubjectWrite" }
        facts: { $ref: "#/components/schemas/ReportFactsWrite" }
        narrative: { $ref: "#/components/schemas/ReportNarrativeWrite" }
        charges:
          type: array
          maxItems: 40
          items: { type: string }
          description: >-
            Violation names from the community's own penal code. We fill in the
            fine and the jail time from it; a name the community does not have
            is refused, so a key can never invent an amount. Read the penal code
            from the community endpoint.
          example: ["Reckless Driving"]

    ReportSubjectWrite:
      type: object
      description: >-
        Who the draft is about. Optional in full: an incident report about an
        unidentified person is a real thing, and refusing it would push you into
        inventing a placeholder player.
      properties:
        player: { $ref: "#/components/schemas/PlayerRef" }
        civilianId:
          type: string
          description: A character the named player owns. Needs `player`.
        displayName:
          type: string
          description: What the reviewer sees when there is no linked player.

    ReportFactsWrite:
      type: object
      description: >-
        What your server observed. Everything here is something a game can
        actually know; nothing here is prose about what it meant.
      properties:
        occurredAt: { type: string }
        location: { type: string }
        summary: { type: string, maxLength: 2000 }
        vehicles: { type: array, maxItems: 25, items: { type: string } }
        witnesses: { type: array, maxItems: 25, items: { type: string } }
        officers: { type: array, maxItems: 25, items: { type: string } }
        forceUsed: { type: boolean }
        fields:
          type: object
          maxProperties: 60
          additionalProperties: { type: string, maxLength: 1000 }
          description: >-
            The named template's own answers, as flat key/value strings. Strings
            only: a nested object is refused.

    ReportNarrativeWrite:
      type: object
      description: >-
        Prose about the facts, kept apart from them. There is no way to mark a
        narrative as evidence, and there will not be: a narrative is an account
        of events, evidence is a thing that exists, and conflating the two in a
        system that produces jail time is not a mistake we could take back.
      properties:
        text: { type: string, maxLength: 8000 }
        generated:
          type: boolean
          default: true
          description: >-
            Whether a model wrote this. **Omitting it means generated**, because
            the callers of this API are automated by definition and of the two
            possible mislabels that is the one that makes a reviewer read more
            carefully. Send `false` only when a person wrote the text.
        generatedBy:
          type: string
          description: What generated it, for example `sixpd-llm`. Ignored when `generated` is false.

    ReportDraft:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string }
        source: { type: string }
        kind: { type: string, enum: [incident, arrest, citation] }
        status:
          type: string
          enum: [draft, submitted, rejected, withdrawn]
          description: >-
            A key can only ever produce `draft`. The rest are written when a
            person acts on it.
        communityId: { type: string }
        callId: { type: string }
        callExternalId: { type: string }
        templateSlug: { type: string }
        departmentId: { type: string }
        subject:
          type: object
          properties:
            playerRef: { type: string }
            userId: { type: string }
            civilianId: { type: string }
            displayName: { type: string }
            synthetic:
              type: boolean
              description: True when the subject is a simulated character.
        facts: { $ref: "#/components/schemas/ReportFactsWrite" }
        narrative:
          type: object
          properties:
            text: { type: string }
            generated: { type: boolean }
            generatedBy: { type: string }
        charges:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              category: { type: string }
              amount: { type: number }
              jailTime: { type: string }
        attachments:
          type: array
          description: >-
            Metadata and a link, never bytes, and never evidence. The reviewer
            on the website sees the same list.
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, enum: [clip, screenshot, log, document, other] }
              label: { type: string }
              url: { type: string }
              contentType: { type: string }
              sizeBytes: { type: integer }
              addedByKeyId: { type: string }
              addedAt: { type: string, format: date-time }
        reportingOfficerId: { type: string }
        reportingOfficerName: { type: string }
        reviewedByName: { type: string }
        reviewedAt: { type: string, format: date-time }
        reviewNotes:
          type: string
          description: What the reviewer said. Show this to your officer when a draft is rejected.
        filedRecordId:
          type: string
          description: The record a person filed from this draft, once they have.
        filedRecordKind: { type: string }
        filed:
          type: boolean
          description: >-
            Whether a person has turned this into a record. Spelled out rather
            than left to be inferred from `status`, because the one thing not to
            conclude from a 201 is that a report exists.
        reviewLink:
          type: string
          description: Opens the draft on the website for whoever may act on it.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WarrantRequest:
      type: object
      required: [externalId, requestingOfficer, probableCause]
      properties:
        externalId: { type: string, maxLength: 128, example: sixpd-warrant-7 }
        source: { type: string, description: Defaults to the key's name. }
        warrantType:
          type: string
          enum: [arrest, search, bench]
          default: arrest
        requestingOfficer:
          allOf: [{ $ref: "#/components/schemas/PlayerRef" }]
          description: >-
            The officer asking. Their community access is what is checked; the
            key's scope only decides whether it may ask at all.
        departmentId: { type: string }
        accused:
          allOf: [{ $ref: "#/components/schemas/PlayerRef" }]
          description: >-
            A player reference. Or name them with `accusedFirstName` and
            `accusedLastName` when the game knows them by name only.
        accusedFirstName: { type: string }
        accusedLastName: { type: string }
        accusedCivilianId:
          type: string
          description: >-
            A character the accused owns. A warrant is against the character
            the officer dealt with, not the person's login, so this wins over
            the account's username.
        probableCause:
          type: string
          maxLength: 2000
          description: >-
            Required. A reviewer cannot act on a request that does not say what
            it is for.
        charges:
          type: array
          items: { type: string }
          description: Violation names from the community's penal code.
        searchLocation:
          type: string
          description: For a search warrant.

    Warrant:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string }
        source: { type: string }
        warrantType: { type: string }
        status:
          type: string
          enum: [pending, approved, denied, executed, expired, withdrawn]
        accusedId: { type: string }
        accusedFirstName: { type: string }
        accusedLastName: { type: string }
        probableCause: { type: string }
        charges: { type: array, items: { type: string } }
        searchLocation: { type: string }
        requestingOfficerId: { type: string }
        requestingOfficerName: { type: string }
        departmentId: { type: string }
        judgeName: { type: string }
        judgeNotes:
          type: string
          description: >-
            Why a request was approved or refused. Tell your officer this; it is
            the only thing that explains a denial.
        reviewedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approved:
          type: boolean
          description: >-
            The question you are actually asking. Spelled out so nobody has to
            decide whether `executed` counts.
        awaitingReview:
          type: boolean
          description: A person has not looked at it yet. Every request starts here.

    ActivityRow:
      type: object
      properties:
        requestId:
          type: string
          description: Ours, returned on every response in `X-Request-Id`.
        correlationId:
          type: string
          description: >-
            Yours, echoed from `X-Correlation-Id` when you sent one. Letters,
            digits and `. _ : -` only.
        communityId: { type: string }
        method: { type: string }
        route:
          type: string
          description: >-
            The route template, not the path you called, a path carries ids,
            and a feed keyed on them would have as many values as there are
            communities.
          example: /communities/{communityId}/dispatch/calls
        status: { type: integer }
        outcome:
          type: string
          enum: [ok, denied, rate_limited, invalid, error]
        errorCode:
          type: string
          description: Our own stable code, the same string your code branched on.
        requiredScope:
          type: string
          description: On a `missing_scope` refusal, the scope the route needed.
        durationMs: { type: integer }
        at: { type: string, format: date-time }

    ChangeEvent:
      type: object
      description: >-
        One change in a community. The same shape a webhook delivery carries
        under `event`, so one handler serves both transports.
      properties:
        id:
          type: string
          description: >-
            Stable, and also the cursor. Use it to recognise a duplicate if you
            run polling and webhooks at once.
        type:
          type: string
          enum:
            - call.created
            - call.updated
            - call.closed
            - call.assigned
            - unit.status_changed
            - record.created
            - report_draft.filed
            - report_draft.rejected
            - warrant.requested
            - warrant.reviewed
          description: >-
            Named after what happened in the product, not after the endpoint
            that caused it, the same change can arrive from the website, the
            app, the bot or a key, and you care about the change.
        communityId: { type: string }
        resourceId:
          type: string
          description: Our id for the thing that changed.
        resourceExternalId:
          type: string
          description: >-
            Your id for it, when you created it. Empty for anything a key did
            not create, which is most of what the website does.
        resourceSource: { type: string }
        actor:
          type: string
          enum: [website, developer_api, mobile, bot, system]
        actorKeyId:
          type: string
          description: >-
            Set when a key caused it, so you can ignore your own writes rather
            than processing them twice.
        data:
          type: object
          additionalProperties: { type: string }
          description: >-
            A small, flat map of ids and short labels, not the changed
            document. Read the resource itself if you want more.
        at: { type: string, format: date-time }

    AttachmentWrite:
      type: object
      required: [url]
      properties:
        kind:
          type: string
          enum: [clip, screenshot, log, document, other]
          default: other
          description: >-
            There is no `evidence` kind and there will not be. A link we have
            not seen is not evidence; let a person decide what it is.
        label: { type: string, maxLength: 120 }
        url:
          type: string
          format: uri
          maxLength: 1024
          description: >-
            http or https, no credentials in it. We never fetch it, it is a
            link a person clicks.
        contentType: { type: string, maxLength: 120 }
        sizeBytes:
          type: integer
          description: >-
            What you say it is. We host nothing, so this is a number for a
            reviewer's screen rather than a storage limit, and it is bounded so
            a typo cannot render "4 PB".

    Attachment:
      allOf:
        - $ref: "#/components/schemas/AttachmentWrite"
        - type: object
          properties:
            id: { type: string }
            addedByKeyId: { type: string }
            addedAt: { type: string, format: date-time }

    UnitStatusResult:
      type: object
      properties:
        player: { type: string }
        playerId: { type: string }
        ok: { type: boolean }
        error:
          type: string
          description: Present when `ok` is false.
          example: player_not_a_member
        message: { type: string }
